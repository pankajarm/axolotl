# Devstral-Small-2-24B-Instruct-2512 LoRA Fine-tuning Config for H100
#
# NOTE: This model is FP8 quantized and requires compute capability >= 8.9
#       H100 has compute capability 9.0, so it can run this model natively
#       We use LoRA (not QLoRA) since the model is already FP8 quantized
#
# Usage:
#   source /home/ubuntu/us-south-2-nano-chat-exp/axolotl/.venv-devstral2/bin/activate
#   axolotl train examples/devstral2/devstral-small-2-24b-lora-h100.yaml

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
base_model: mistralai/Devstral-Small-2-24B-Instruct-2512
tokenizer_use_mistral_common: true

# Automatically upload checkpoint and final model to HF
hub_model_id: pankajmathur/Devstral-Small-2-24B-Instruct-2512-sft-v1

# Cut Cross Entropy plugin for reduced VRAM usage
plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# =============================================================================
# NO QUANTIZATION - Model is already FP8
# =============================================================================
load_in_8bit: false
load_in_4bit: false

# =============================================================================
# DATASET CONFIGURATION
# =============================================================================
datasets:
  - path: pankajmathur/OpenThoughts-Agent-v1-SFT
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content

dataset_prepared_path: /home/ubuntu/us-south-2-nano-chat-exp/dataset/last_run_prepared/Devstral-Small-2-24B-Instruct-2512-sft-v1
val_set_size: 0.1
output_dir: /home/ubuntu/us-south-2-nano-chat-exp/outputs/Devstral-Small-2-24B-Instruct-2512-sft-v1/lora-out

# =============================================================================
# ADAPTER CONFIGURATION (LoRA - not QLoRA since model is FP8)
# =============================================================================
adapter: lora
lora_model_dir:

# Sequence length - H100 can handle larger sequences
sequence_len: 8192
sample_packing: true

lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true
lora_target_modules:
  - gate_proj
  - down_proj
  - up_proj
  - q_proj
  - v_proj
  - k_proj
  - o_proj

# =============================================================================
# WEIGHTS & BIASES
# =============================================================================
wandb_project: new_hope
wandb_entity:
wandb_watch:
wandb_name: Devstral-Small-2-24B-Instruct-2512-sft-v1-h100
wandb_log_model:

# =============================================================================
# TRAINING HYPERPARAMETERS
# =============================================================================
# Optimized for H100 80GB with 24B FP8 model
# H100 has more VRAM and faster memory bandwidth, so we can use larger batches
# Will be tuned based on quicktest VRAM utilization
# Target: ~85-90% VRAM usage for optimal throughput
gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 3
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 0.0001

bf16: auto
tf32: false

gradient_checkpointing: true
resume_from_checkpoint:
logging_steps: 1
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 4
save_total_limit: 4

# Loss monitoring
loss_watchdog_threshold: 5.0
loss_watchdog_patience: 3

# Uncomment to validate checkpoint saving works with your config
# save_first_step: true

