# QUICK TEST CONFIG - Devstral-Small-2507 QLoRA
# ~5-10 min end-to-end test: training + checkpoint save + eval
#
# NOTE: Using Devstral-Small-2507 (BF16) because Devstral-Small-2-24B (FP8)
#       requires compute capability >= 8.9 (H100/4090), but A100 is only 8.0
#
# Run: axolotl train examples/devstral2/devstral-small-2507-qlora-quicktest.yaml

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
base_model: mistralai/Devstral-Small-2507
tokenizer_use_mistral_common: true

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# =============================================================================
# QUANTIZATION (QLoRA 4-bit) - Works because model is BF16
# =============================================================================
load_in_8bit: false
load_in_4bit: true

# =============================================================================
# DATASET CONFIGURATION
# =============================================================================
datasets:
  - path: pankajmathur/OpenThoughts-Agent-v1-SFT
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content

dataset_prepared_path: /home/ubuntu/us-east-1-nano-chat-exp/dataset/last_run_prepared/Devstral-Small-2507-quicktest
val_set_size: 0.05
output_dir: /home/ubuntu/us-east-1-nano-chat-exp/outputs/Devstral-Small-2507-quicktest/qlora-out

# =============================================================================
# ADAPTER CONFIGURATION (QLoRA)
# =============================================================================
adapter: qlora
lora_model_dir:

# Reduced sequence length for quicktest
sequence_len: 4096
sample_packing: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
lora_target_modules:
  - gate_proj
  - down_proj
  - up_proj
  - q_proj
  - v_proj
  - k_proj
  - o_proj

# =============================================================================
# WEIGHTS & BIASES - Enable for quicktest validation
# =============================================================================
wandb_project: new_hope
wandb_name: Devstral-Small-2507-quicktest

# =============================================================================
# QUICK TEST SETTINGS (~5-10 min total):
# - Only 5 training steps
# - Save checkpoint at step 3 to test saving
# - Eval at end (step 5)
# =============================================================================
max_steps: 5
gradient_accumulation_steps: 4
micro_batch_size: 1

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0001

bf16: auto
tf32: false

gradient_checkpointing: true
logging_steps: 1
flash_attention: true

warmup_ratio: 0.1

# Eval strategy
eval_strategy: steps
eval_steps: 5

# Save checkpoint at step 3 to test checkpoint saving
save_strategy: steps
save_steps: 3
save_total_limit: 1

# Loss monitoring
loss_watchdog_threshold: 5.0
loss_watchdog_patience: 3

